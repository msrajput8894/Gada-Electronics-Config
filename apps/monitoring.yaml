apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.3.0
    helm:
      releaseName: monitoring
      valuesObject:
        # k3s does not expose these components' metrics ports.
        # Scraping them would give permanent false "down" alerts.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            # Select ServiceMonitors and rules from any namespace.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 200m, memory: 512Mi }
              limits: { memory: 1Gi }
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 128Mi }
        grafana:
          defaultDashboardsTimezone: Asia/Kolkata
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 768Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus CRDs are too big for a client-side apply.
      - ServerSideApply=true
