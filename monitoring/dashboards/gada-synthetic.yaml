apiVersion: v1
kind: ConfigMap
metadata:
  name: gada-synthetic-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gada-synthetic.json: |
    {
      "uid": "gada-synthetic",
      "title": "Gada synthetic availability",
      "tags": [
        "gada",
        "availability",
        "synthetic"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "graphTooltip": 1,
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "env",
            "label": "Environment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(gada_synthetic_journey_success, env)",
              "refId": "env"
            },
            "definition": "label_values(gada_synthetic_journey_success, env)",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "prod",
              "value": "prod"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability now (5-minute average)",
          "description": "Share of customer-journey checks that passed in the last 5 minutes. One failure in ten shows 90%.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 14,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * avg_over_time(gada_synthetic_journey_success[5m])",
              "legendFormat": "{{env}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 100
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Availability, last 24 hours",
          "description": "Prometheus keeps 2 days of data here, so 24 hours is the longest window available.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 10,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * avg_over_time(gada_synthetic_journey_success[24h])",
              "legendFormat": "{{env}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 99
                  },
                  {
                    "color": "green",
                    "value": 99.9
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Availability over time (5-minute average)",
          "description": "Drops when checks keep failing and climbs back when they pass.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 16,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * avg_over_time(gada_synthetic_journey_success[5m])",
              "legendFormat": "{{env}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Monitor heartbeat for $env",
          "description": "Should stay under 30 seconds. If it grows, the monitor itself has stopped.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - gada_synthetic_last_run_timestamp_seconds{env=\"$env\"}",
              "legendFormat": "seconds since last run",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 90
                  },
                  {
                    "color": "red",
                    "value": 180
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Failed checks, last hour",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 8,
            "w": 8,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(gada_synthetic_checks_total{env=\"$env\",result=~\"fail|skipped\"}[1h]))",
              "legendFormat": "$env",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 6,
          "type": "state-timeline",
          "title": "Step status for $env",
          "description": "Green is a passing step. If an early step fails, later steps that depend on it show red as well.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "gada_synthetic_success{env=\"$env\"}",
              "legendFormat": "{{step}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "FAIL",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "OK",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.85,
            "legend": {
              "showLegend": false
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Response time per step for $env",
          "description": "Time each check took on its last run.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "gada_synthetic_duration_seconds{env=\"$env\"}",
              "legendFormat": "{{step}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Failed checks per step for $env",
          "description": "Failures in each 5-minute window.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (step) (increase(gada_synthetic_checks_total{env=\"$env\",result=~\"fail|skipped\"}[5m]))",
              "legendFormat": "{{step}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "logs",
          "title": "Failed checks (what the monitor saw)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"monitoring\", app=\"gada-synthetic\"} |= \"failed\" | json | env=\"$env\"",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        }
      ]
    }
