{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gada-app
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}
  revisionHistoryLimit: 2
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      steps:
        - setWeight: 25
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: gada-error-rate
            args:
              - name: namespace
                value: {{ .Release.Namespace }}
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 60s}
  selector:
    matchLabels:
      app: gada-app
  template:
    {{- include "gada.podTemplate" . | nindent 4 }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gada-app
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gada-app
  template:
    {{- include "gada.podTemplate" . | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gada-app
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: gada-app
  ports:
    - port: 80
      targetPort: 3000
