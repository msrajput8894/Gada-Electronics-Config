apiVersion: v1
kind: ConfigMap
metadata:
  name: gada-checkout-health-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gada-checkout-health.json: |
    {
      "uid": "gada-checkout-health",
      "title": "Gada checkout health",
      "tags": ["gada", "checkout", "health"],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Environment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(gada_checkout_failures_total, namespace)",
              "refId": "namespace"
            },
            "definition": "label_values(gada_checkout_failures_total, namespace)",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "gada-prod",
              "value": "gada-prod"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Failed checkout attempts (1h)",
          "description": "Excludes empty-cart requests; includes unavailable products, stock conflicts, and checkout errors.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(gada_checkout_failures_total{namespace=\"$namespace\",reason=~\"product_unavailable|out_of_stock|error\"}[1h])) or vector(0)",
              "legendFormat": "failures",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Checkout failures by reason",
          "description": "Five-minute rolling rate, displayed as failures per minute.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 18,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (reason) (rate(gada_checkout_failures_total{namespace=\"$namespace\",reason=~\"product_unavailable|out_of_stock|error\"}[5m])) * 60",
              "legendFormat": "{{reason}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Request latency p95",
          "description": "Application request latency across all routes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "p95",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Ready app pods",
          "description": "Pods reporting ready in the selected environment; zero indicates the service is unavailable.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_ready{namespace=\"$namespace\",condition=\"true\",pod=~\"gada-app-.*\"}) or vector(0)",
              "legendFormat": "ready",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "textMode": "value"
          }
        }
      ]
    }
