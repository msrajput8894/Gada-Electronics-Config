apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/msrajput8894/Gada-Electronics-Config
    targetRevision: main
    path: monitoring/alerts
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
