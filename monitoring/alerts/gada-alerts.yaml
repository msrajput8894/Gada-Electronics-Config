apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gada-alerts
  namespace: monitoring
spec:
  groups:
    - name: gada-app
      rules:
        - alert: GadaTargetDown
          expr: up{pod=~"gada-app.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Metrics target {{ $labels.pod }} is down"
            runbook: "kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}; check events, then logs --previous"
        - alert: GadaHighErrorRate
          expr: |
            sum by (namespace) (rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
              / sum by (namespace) (rate(http_request_duration_seconds_count[5m])) > 0.05
            and sum by (namespace) (rate(http_request_duration_seconds_count[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "More than 5% of requests fail in {{ $labels.namespace }}"
            runbook: "Check Grafana error panel, then kubectl logs deploy/gada-app; did a rollout just happen (argocd app history)?"
        - alert: GadaSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (namespace, le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "p95 latency above 1s in {{ $labels.namespace }}"
            runbook: "Check CPU and memory panels, MongoDB pod health, and recent deploys"
    - name: kubernetes-health
      rules:
        - alert: PodRestartingOften
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than twice in 15m"
            runbook: "kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }} (look at Last State and Reason)"
        - alert: PodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
            runbook: "Compare usage with the limit; raise the limit in Git only if usage is genuinely that high"
        - alert: MemoryNearLimit
          expr: |
            max by (namespace, pod) (container_memory_working_set_bytes{container!="",container!="POD"})
              / max by (namespace, pod) (kube_pod_container_resource_limits{resource="memory"}) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} uses over 90% of its memory limit"
            runbook: "Steadily climbing means a leak; flat means the limit is too tight"
        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (kube_pod_status_ready{condition="false"}) > 0
            and on (namespace, pod) kube_pod_status_phase{phase="Running"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} not ready for 10 minutes"
            runbook: "kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}; check probes and events"
    - name: gada-availability
      rules:
        - alert: GadaAppUnavailable
          expr: kube_deployment_status_replicas_available{deployment="gada-app"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "No gada-app pods available in {{ $labels.namespace }}"
            runbook: "kubectl -n {{ $labels.namespace }} get pods,events; check argocd app and the last rollout"
    - name: gada-slo-recording
      rules:
        - record: gada:sli_error_ratio:rate5m
          expr: |
            (sum(rate(http_request_duration_seconds_count{namespace="gada-prod",status_code=~"5.."}[5m])) or vector(0))
              / sum(rate(http_request_duration_seconds_count{namespace="gada-prod"}[5m]))
        - record: gada:sli_error_ratio:rate30m
          expr: |
            (sum(rate(http_request_duration_seconds_count{namespace="gada-prod",status_code=~"5.."}[30m])) or vector(0))
              / sum(rate(http_request_duration_seconds_count{namespace="gada-prod"}[30m]))
        - record: gada:sli_error_ratio:rate1h
          expr: |
            (sum(rate(http_request_duration_seconds_count{namespace="gada-prod",status_code=~"5.."}[1h])) or vector(0))
              / sum(rate(http_request_duration_seconds_count{namespace="gada-prod"}[1h]))
        - record: gada:sli_error_ratio:rate6h
          expr: |
            (sum(rate(http_request_duration_seconds_count{namespace="gada-prod",status_code=~"5.."}[6h])) or vector(0))
              / sum(rate(http_request_duration_seconds_count{namespace="gada-prod"}[6h]))
    - name: gada-slo-alerts
      rules:
        - alert: GadaSLOFastBurn
          expr: gada:sli_error_ratio:rate1h > 0.144 and gada:sli_error_ratio:rate5m > 0.144
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Prod is burning its 99% SLO error budget 14x too fast"
            runbook: "Check the error panel, recent rollout (argocd app history gada-prod), and roll back if it started with a deploy"
        - alert: GadaSLOSlowBurn
          expr: gada:sli_error_ratio:rate6h > 0.06 and gada:sli_error_ratio:rate30m > 0.06
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Prod is burning its 99% SLO error budget 6x too fast"
            runbook: "A steady trickle of 5xx; find the failing route in the error panel and check logs"
    - name: gada-synthetic
      rules:
        - alert: GadaSyntheticJourneyFailing
          expr: avg_over_time(gada_synthetic_journey_success{env="prod"}[3m]) < 0.67
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Prod customer journey is failing for the monitor account"
            runbook: "Grafana dashboard 'Gada synthetic availability' shows which step fails; failed checks are in Loki: {namespace=\"monitoring\", app=\"gada-synthetic\"} |= \"failed\""
        - alert: GadaSyntheticJourneyFailingNonProd
          expr: avg_over_time(gada_synthetic_journey_success{env!="prod"}[3m]) < 0.67
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The {{ $labels.env }} customer journey is failing for the monitor account"
            runbook: "Check which step fails on the synthetic dashboard, then kubectl -n gada-{{ $labels.env }} get pods"
        - alert: GadaSyntheticStepSlow
          expr: |
            max by (env, step) (gada_synthetic_duration_seconds) > 2
              and on (env, step) gada_synthetic_success == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Step {{ $labels.step }} in {{ $labels.env }} takes over 2 seconds"
            runbook: "Check p95 latency, CPU and MongoDB; look for a recent rollout"
        - alert: GadaSyntheticMonitorSilent
          expr: |
            absent(gada_synthetic_last_run_timestamp_seconds)
              or (time() - max(gada_synthetic_last_run_timestamp_seconds)) > 300
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "The synthetic monitor stopped reporting, so availability is not being measured"
            runbook: "kubectl -n monitoring get pods -l app=gada-synthetic; describe the pod and read its logs"
