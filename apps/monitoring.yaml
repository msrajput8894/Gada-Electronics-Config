apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.3.0
    helm:
      releaseName: monitoring
      valuesObject:
        # k3s does not expose these components' metrics ports.
        # Scraping them would give permanent false "down" alerts.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            # Select ServiceMonitors and rules from any namespace.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 200m, memory: 512Mi }
              limits: { memory: 1Gi }
        alertmanager:
          alertmanagerSpec:
            # Holds the Slack webhook URL; created by scripts/create-secrets.sh.
            # Mounted at /etc/alertmanager/secrets/alertmanager-slack/url
            secrets:
              - alertmanager-slack
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 128Mi }
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: "null"
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
                - receiver: slack
                  matchers:
                    - severity =~ "warning|critical"
            receivers:
              - name: "null"
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
                    text: |-
                      {{ range .Alerts }}*{{ .Annotations.summary }}*
                      {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ else if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
                      {{ end }}
            templates:
              - /etc/alertmanager/config/*.tmpl
        grafana:
          defaultDashboardsTimezone: Asia/Kolkata
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 768Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus CRDs are too big for a client-side apply.
      - ServerSideApply=true
