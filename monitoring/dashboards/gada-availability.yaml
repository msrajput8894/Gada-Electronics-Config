apiVersion: v1
kind: ConfigMap
metadata:
  name: gada-availability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gada-availability.json: |
    {
      "uid": "gada-availability",
      "title": "Gada availability and health",
      "tags": [
        "gada",
        "availability"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "graphTooltip": 1,
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Environment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(http_request_duration_seconds_count, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(http_request_duration_seconds_count, namespace)",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "gada-prod",
              "value": "gada-prod"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability (5m)",
          "description": "Share of requests that did not return 5xx; shows 0 when no pod is available. SLO target is 99%.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - ((sum(rate(http_request_duration_seconds_count{namespace=\"$namespace\",status_code=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_request_duration_seconds_count{namespace=\"$namespace\"}[5m])))) * clamp_max(sum(kube_deployment_status_replicas_available{namespace=\"$namespace\",deployment=\"gada-app\"}) or vector(0), 1)",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 99
                  },
                  {
                    "color": "green",
                    "value": 99.9
                  }
                ]
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods available",
          "description": "Ready gada-app pods. 0 means the app is down.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"$namespace\",deployment=\"gada-app\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Error rate (5m)",
          "description": "Percent of requests returning 5xx.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * ((sum(rate(http_request_duration_seconds_count{namespace=\"$namespace\",status_code=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_request_duration_seconds_count{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p95 latency",
          "description": "95 of 100 requests are faster than this.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Requests / sec",
          "description": "Current traffic.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_request_duration_seconds_count{namespace=\"$namespace\"}[1m]))",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Firing alerts",
          "description": "Alerts firing anywhere in the cluster.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",alertname!=\"Watchdog\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Requests per second by status code",
          "description": "Look for 5xx lines appearing.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status_code) (rate(http_request_duration_seconds_count{namespace=\"$namespace\"}[1m]))",
              "legendFormat": "{{status_code}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Error rate % (1m)",
          "description": "Line marks the 5% fast-burn alert level.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * ((sum(rate(http_request_duration_seconds_count{namespace=\"$namespace\",status_code=~\"5..\"}[1m])) or vector(0)) / sum(rate(http_request_duration_seconds_count{namespace=\"$namespace\"}[1m])))",
              "legendFormat": "errors %",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Pods available vs desired",
          "description": "A gap between the lines means pods are down or starting.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"$namespace\",deployment=\"gada-app\"})",
              "legendFormat": "available",
              "refId": "A",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_deployment_spec_replicas{namespace=\"$namespace\",deployment=\"gada-app\"})",
              "legendFormat": "desired",
              "refId": "B",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "CPU usage per pod (cores)",
          "description": "CPU cores used by each pod.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Memory vs limit",
          "description": "Used memory approaching the limit means an OOM kill is near.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\",container=\"app\"})",
              "legendFormat": "{{pod}} used",
              "refId": "A",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"memory\",container=\"app\"})",
              "legendFormat": "{{pod}} limit",
              "refId": "B",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Error log lines per second",
          "description": "Rate of log lines containing error, exception or fatal.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(rate({namespace=\"$namespace\"} |~ \"(?i)error|exception|fatal\" [1m]))",
              "legendFormat": "error lines",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Pod restarts (10m)",
          "description": "Restarts in the last 10 minutes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 20,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[10m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "type": "table",
          "title": "Firing alerts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 20,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{alertstate=\"firing\",alertname!=\"Watchdog\"}",
              "format": "table",
              "instant": true,
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "includeByName": {
                  "alertname": true,
                  "severity": true,
                  "namespace": true,
                  "pod": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 15,
          "type": "logs",
          "title": "Errors and warnings (live)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"$namespace\"} |~ \"(?i)error|warn|exception|fatal\"",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        },
        {
          "id": 16,
          "type": "logs",
          "title": "All app logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 35,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"$namespace\", app=\"gada-app\"}",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        }
      ]
    }
