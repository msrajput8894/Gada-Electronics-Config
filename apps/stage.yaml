apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gada-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/msrajput8894/Gada-Electronics-Config.git
    targetRevision: main
    path: chart/gada
    helm:
      releaseName: gada
      valueFiles:
        - ../../envs/stage/values.yaml
      parameters:
        - name: ingress.host
          value: stage.__IP__.nip.io
  destination:
    server: https://kubernetes.default.svc
    namespace: gada-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
